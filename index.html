<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Finder</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
html{
scroll-behavior:smooth;
}

body::-webkit-scrollbar{
width:10px;
}

body::-webkit-scrollbar-thumb{
background:linear-gradient(180deg,#ef4444,#f97316);
border-radius:20px;
}

body{
background:radial-gradient(circle at top left, rgba(239,68,68,0.22), transparent 24%), linear-gradient(135deg,#020617 0%,#0f172a 100%);
min-height:100vh;
}

.glow-card{
box-shadow:0 20px 45px rgba(2,6,23,0.45);
}
</style>

</head>

<body class="text-white">

<div class="fixed inset-0 -z-10 overflow-hidden">

<div class="absolute -top-44 -left-40 h-96 w-96 rounded-full bg-red-500/20 blur-3xl"></div>

<div class="absolute bottom-0 right-0 h-[450px] w-[450px] rounded-full bg-blue-500/20 blur-3xl"></div>

</div>

<header class="sticky top-0 backdrop-blur-lg bg-slate-950/80 border-b border-slate-800 z-50">

<div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-5">

<h1 class="text-3xl font-black tracking-wider">

 Movie Finder

</h1>

<p class="text-gray-400 hidden md:block">

Discover your next favourite movie

</p>

</div>

</header>

<section class="max-w-7xl mx-auto text-center py-20 px-5">

<div class="mx-auto mb-6 inline-flex items-center gap-2 rounded-full border border-red-500/30 bg-red-500/10 px-4 py-2 text-sm font-semibold text-red-300">
  ✨ Trending now
</div>

<h2 class="text-5xl font-black tracking-tight text-white sm:text-6xl">

Discover Amazing Movies

</h2>

<p class="text-gray-400 mt-5 text-lg">

Search thousands of movies instantly and save your favorites in one place.

</p>

<form
id="searchForm"
class="mt-10 flex justify-center">

<div class="relative w-full max-w-2xl">

<input

id="searchInput"

type="text"

placeholder="Search movies..."

class="w-full rounded-full bg-slate-900 border border-slate-700 px-7 py-5 text-lg outline-none focus:ring-2 focus:ring-red-500"/>

<button

type="submit" id="searchButton"

class="absolute right-2 top-2 bg-red-500 hover:bg-red-600 px-6 py-3 rounded-full duration-300">

Search

</button>

</div>

</form>

<div id="quickTags" class="mt-8 flex flex-wrap justify-center gap-3 text-sm text-slate-300">
  <button type="button" data-search="latest movies" class="rounded-full border border-slate-700 bg-slate-900/80 px-4 py-2 transition hover:border-red-500 hover:bg-red-500/10 hover:text-white">New releases</button>
  <button type="button" data-search="top rated movies" class="rounded-full border border-slate-700 bg-slate-900/80 px-4 py-2 transition hover:border-red-500 hover:bg-red-500/10 hover:text-white">Top rated</button>
  <button type="button" data-search="popular movies" class="rounded-full border border-slate-700 bg-slate-900/80 px-4 py-2 transition hover:border-red-500 hover:bg-red-500/10 hover:text-white">Fan favorites</button>
</div>

</section>

<main class="max-w-7xl mx-auto px-5">

<div id="status" class="mb-8"></div>

<section class="mb-16 rounded-3xl border border-slate-800 bg-slate-950/70 p-6 glow-card">

<div class="flex items-center justify-between mb-8">
  <h2 class="text-3xl font-bold">
     Favourite Movies
  </h2>
  <button id="clearFavoritesBtn" type="button" class="rounded-full border border-slate-700 px-4 py-2 text-sm text-gray-300 hover:border-red-500 hover:text-white">
    Clear All
  </button>
</div>

<div
id="favoriteContainer"
class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

</div>

</section>

<section class="rounded-3xl border border-slate-800 bg-slate-950/70 p-6 glow-card">

<h2 class="text-3xl font-bold mb-2">

  Movie Results

</h2>

<p
id="resultCount"
class="text-gray-400 mb-8">

Search for a movie...

</p>

<div

id="movieContainer"

class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8">

</div>

<div

id="paginationContainer"

class="flex justify-center mt-10">

</div>

</section>
<!-- Modal -->
    <div id="movieModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50">
      <div id="modalContent" class="bg-slate-900 rounded-xl p-6 w-[80%] max-w-2xl max-h-[70vh] overflow-y-auto relative" role="dialog">
        <button class="absolute top-2 right-3 text-2xl font-bold hover:scale-110 tra text-gray-500 hover:text-red-700"
        id="closeModal">&times;</button>
        <div id="modalBody"></div>
      </div>
    </div>


</main>

<footer class="mt-20 border-t border-slate-800 py-10 text-center text-gray-400">

<p>&copy; 2026 Movie Finder Group 7 IOTBTECH</p>


</footer>


<script src="script.js"></script>

</body>
</html>
